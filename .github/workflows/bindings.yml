name: bindings

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node wire/rs/check-package.mjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r wire/py/requirements-dev.txt
      - run: python wire/py/check.py
  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed https://www.swift.org/keys/all-keys.asc | gpg --import -
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: '6.1.3'
      - run: node wire/swift/check.mjs
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B "$RUNNER_TEMP/bitwire-cpp" -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build "$RUNNER_TEMP/bitwire-cpp"
      - run: ctest --test-dir "$RUNNER_TEMP/bitwire-cpp" --output-on-failure
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: mvn --batch-mode --file wire/java/pom.xml verify
      - run: node wire/java/check-consumer.mjs
  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - run: cabal update
      - run: node wire/hs/check.mjs
      - name: Consume the immutable public Haskell Git release
        run: node wire/hs/check-git.mjs
  bindings:
    if: always()
    needs: [rust, python, swift, cpp, java, haskell]
    runs-on: ubuntu-latest
    steps:
      - name: Require every binding package check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) { if(job.result!=="success") throw new Error(`${name} did not pass`); }'
